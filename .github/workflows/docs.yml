name: Documentation checks

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'tools/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'tools/**'
      - '.github/workflows/docs.yml'

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check links, front matter and terminology
        run: python tools/docs_check.py
